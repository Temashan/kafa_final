clusters=primary,dr

# --- CONNECT WORKER ---
group.id=mirror-maker-group
key.converter=org.apache.kafka.connect.converters.ByteArrayConverter
value.converter=org.apache.kafka.connect.converters.ByteArrayConverter
header.converter=org.apache.kafka.connect.storage.SimpleHeaderConverter

# --- GLOBAL SECURITY (fallback for clients) ---
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="mm2" password="mm2-secret";
ssl.truststore.location=/etc/kafka/ssl/keystores/kafka.truststore.jks
ssl.truststore.password=123456
ssl.truststore.type=JKS
ssl.endpoint.identification.algorithm=HTTPS

# --- CLUSTERS ---
primary.bootstrap.servers=kafka-0:9092,kafka-1:9092,kafka-2:9092
dr.bootstrap.servers=dr-kafka-0:9092

# --- MIRROR FLOW ---
primary->dr.enabled=true
primary->dr.topics=products\..*|recommendations
primary->dr.groups=.*
replication.policy.class=org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# Optional
primary->dr.emit.heartbeats.enabled=true
primary->dr.emit.checkpoints.enabled=true
primary->dr.sync.group.offsets.enabled=true
primary->dr.sync.topic.configs.enabled=true
primary->dr.sync.topic.acls.enabled=false

# --- INTERNAL TOPICS ---
config.storage.topic=mm2-configs.internal
offset.storage.topic=mm2-offsets.internal
status.storage.topic=mm2-status.internal
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
heartbeats.topic.replication.factor=1
checkpoints.topic.replication.factor=1
offset-syncs.topic.replication.factor=1

# --- PERFORMANCE / REFRESH ---
tasks.max=1
replication.factor=1
refresh.topics.enabled=true
refresh.topics.interval.seconds=15
refresh.groups.interval.seconds=30
primary.consumer.auto.offset.reset=earliest

# --- EXPLICIT ROLE-BASED SECURITY (safer for MM2) ---
primary.consumer.security.protocol=SASL_SSL
primary.consumer.sasl.mechanism=PLAIN
primary.consumer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="mm2" password="mm2-secret";
primary.consumer.ssl.truststore.location=/etc/kafka/ssl/keystores/kafka.truststore.jks
primary.consumer.ssl.truststore.password=123456
primary.consumer.ssl.truststore.type=JKS
primary.consumer.ssl.endpoint.identification.algorithm=HTTPS

primary.admin.security.protocol=SASL_SSL
primary.admin.sasl.mechanism=PLAIN
primary.admin.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="mm2" password="mm2-secret";
primary.admin.ssl.truststore.location=/etc/kafka/ssl/keystores/kafka.truststore.jks
primary.admin.ssl.truststore.password=123456
primary.admin.ssl.truststore.type=JKS
primary.admin.ssl.endpoint.identification.algorithm=HTTPS

dr.producer.security.protocol=SASL_SSL
dr.producer.sasl.mechanism=PLAIN
dr.producer.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="mm2" password="mm2-secret";
dr.producer.ssl.truststore.location=/etc/kafka/ssl/keystores/kafka.truststore.jks
dr.producer.ssl.truststore.password=123456
dr.producer.ssl.truststore.type=JKS
dr.producer.ssl.endpoint.identification.algorithm=HTTPS

dr.admin.security.protocol=SASL_SSL
dr.admin.sasl.mechanism=PLAIN
dr.admin.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="mm2" password="mm2-secret";
dr.admin.ssl.truststore.location=/etc/kafka/ssl/keystores/kafka.truststore.jks
dr.admin.ssl.truststore.password=123456
dr.admin.ssl.truststore.type=JKS
dr.admin.ssl.endpoint.identification.algorithm=HTTPS
