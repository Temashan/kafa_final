global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: kafka-jmx
    static_configs:
      - targets:
          - kafka-0-jmx:5556
        labels:
          cluster: primary
          broker: kafka-0
      - targets:
          - kafka-1-jmx:5556
        labels:
          cluster: primary
          broker: kafka-1
      - targets:
          - kafka-2-jmx:5556
        labels:
          cluster: primary
          broker: kafka-2
      - targets:
          - dr-kafka-0-jmx:5556
        labels:
          cluster: dr
          broker: dr-kafka-0
